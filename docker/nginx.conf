server {
    listen 80;
    server_name localhost _;

    # Root directory for static frontend build
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression for production assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Lightweight Health check endpoint
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Reverse proxy API requests to backend service
    location /api/ {
        proxy_pass http://backend:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    # Proxy uploaded images to backend
    location /uploads/ {
        proxy_pass http://backend:5001/uploads/;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1d;
        expires 1d;
    }

    # Proxy local catalog product image files to backend (only matching media extensions)
    # allowing /products to resolve to the React SPA index.html
    location ~* ^/products/.+\.(jpg|jpeg|png|gif|svg|webp)$ {
        proxy_pass http://backend:5001;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1d;
        expires 1d;
    }

    # Cache immutable Vite static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA routing: files match $uri, all page routes fall back to index.html
    location / {
        try_files $uri /index.html;
    }

    # 404 / 50x error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
