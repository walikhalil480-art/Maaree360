apiVersion: v1
kind: Service
metadata:
  name: smartstock-frontend
  namespace: smartstock
  labels:
    app.kubernetes.io/name: smartstock
    app.kubernetes.io/component: frontend-ui
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 80
  selector:
    app.kubernetes.io/name: smartstock
    app.kubernetes.io/component: frontend-ui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartstock-frontend
  namespace: smartstock
  labels:
    app.kubernetes.io/name: smartstock
    app.kubernetes.io/component: frontend-ui
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: smartstock
      app.kubernetes.io/component: frontend-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smartstock
        app.kubernetes.io/component: frontend-ui
    spec:
      containers:
        - name: frontend
          image: smartstock-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
