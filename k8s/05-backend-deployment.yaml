apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: smartstock
  labels:
    app.kubernetes.io/name: smartstock
    app.kubernetes.io/component: backend-api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 5001
      targetPort: 5001
  selector:
    app.kubernetes.io/name: smartstock
    app.kubernetes.io/component: backend-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartstock-backend
  namespace: smartstock
  labels:
    app.kubernetes.io/name: smartstock
    app.kubernetes.io/component: backend-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: smartstock
      app.kubernetes.io/component: backend-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smartstock
        app.kubernetes.io/component: backend-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: backend
          image: smartstock-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5001
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: smartstock-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: smartstock-config
                  key: PORT
            - name: DEFAULT_CURRENCY
              valueFrom:
                configMapKeyRef:
                  name: smartstock-config
                  key: DEFAULT_CURRENCY
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: smartstock-config
                  key: FRONTEND_URL
            - name: COOKIE_NAME
              valueFrom:
                configMapKeyRef:
                  name: smartstock-config
                  key: COOKIE_NAME
            - name: SESSION_TTL_DAYS
              valueFrom:
                configMapKeyRef:
                  name: smartstock-config
                  key: SESSION_TTL_DAYS
            - name: PRODUCTS_DIR
              valueFrom:
                configMapKeyRef:
                  name: smartstock-config
                  key: PRODUCTS_DIR
            - name: UPLOAD_DIR
              valueFrom:
                configMapKeyRef:
                  name: smartstock-config
                  key: UPLOAD_DIR
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: smartstock-secrets
                  key: SESSION_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: smartstock-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 5001
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 5001
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: smartstock-uploads-pvc
