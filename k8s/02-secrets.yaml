apiVersion: v1
kind: Secret
metadata:
  name: smartstock-secrets
  namespace: smartstock
  labels:
    app.kubernetes.io/name: smartstock
    app.kubernetes.io/part-of: maaree360
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres_secure_password"
  SESSION_SECRET: "smartstock-production-super-secret-key-32chars"
  DATABASE_URL: "postgresql://postgres:postgres_secure_password@db:5432/smartstock_db?schema=public"
