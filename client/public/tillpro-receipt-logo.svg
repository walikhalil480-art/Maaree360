<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 36" fill="none">
  <!-- TillPro Monochrome Thermal Receipt Logo -->
  <g transform="translate(2, 2)">
    <!-- Base Container -->
    <rect width="32" height="32" rx="6" fill="#000000"/>
    
    <!-- Register Screen Cutout -->
    <rect x="5.5" y="5.5" width="21" height="12" rx="2" fill="#FFFFFF"/>
    
    <!-- Barcode Lines in Black -->
    <line x1="9" y1="8" x2="9" y2="15" stroke="#000000" stroke-width="1.8"/>
    <line x1="12" y1="8" x2="12" y2="15" stroke="#000000" stroke-width="1.2"/>
    <line x1="15" y1="8" x2="15" y2="15" stroke="#000000" stroke-width="2.2"/>
    <line x1="18.5" y1="8" x2="18.5" y2="15" stroke="#000000" stroke-width="1.5"/>
    <line x1="21.5" y1="8" x2="21.5" y2="15" stroke="#000000" stroke-width="1.2"/>
    
    <!-- Till Base Slot -->
    <rect x="5.5" y="20" width="21" height="6.5" rx="1.5" fill="#FFFFFF"/>
    <rect x="10.5" y="22" width="11" height="2" rx="0.5" fill="#000000"/>
  </g>

  <!-- TillPro Wordmark (Bold Black) -->
  <text x="42" y="22" font-family="'Courier New', monospace, sans-serif" font-size="18" font-weight="900" letter-spacing="-0.02em" fill="#000000">
    TillPro
  </text>
  <text x="42.5" y="31" font-family="'Courier New', monospace, sans-serif" font-size="6.5" font-weight="700" letter-spacing="0.1em" fill="#000000">
    RETAIL POS SYSTEM
  </text>
</svg>
