<!-- SmartStock Supermarket Product Packshot: Crisp Red Royal Gala Apples 4-Pack -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad_PROD_014" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F7F5F0" />
    </radialGradient>
    <filter id="packShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172B4D" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#172B4D" flood-opacity="0.08" />
    </filter>
    <linearGradient id="pGrad_PROD_014" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B71C1C" />
      <stop offset="100%" stop-color="#B71C1C" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="320" rx="16" fill="url(#bgGrad_PROD_014)" />

  <!-- Shadow under pack -->
  <ellipse cx="160" cy="275" rx="72" ry="12" fill="#172B4D" opacity="0.10" />

  <!-- Main Product Container (Square / Retail Packshot) -->
  <g filter="url(#packShadow)">
    
      <!-- Produce Silhouette / Basket -->
      <rect x="90" y="65" width="140" height="175" rx="24" fill="url(#pGrad_PROD_014)" stroke="#E4E7EC" stroke-width="2" />
      <!-- Organic leaf accent -->
      <path d="M 160 55 C 145 35 175 35 160 55" fill="#FFCDD2" />
      <circle cx="160" cy="125" r="32" fill="#FFFFFF" opacity="0.25" />
      <text x="160" y="170" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">FRESH FARM</text>
      <text x="160" y="195" font-family="'Inter', -apple-system, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" opacity="0.9" text-anchor="middle">ROYAL GALA APPLES - 4 PACK</text>
      <rect x="120" y="210" width="80" height="18" rx="9" fill="#FFCDD2" />
      <text x="160" y="222" font-family="'Inter', -apple-system, sans-serif" font-size="8" font-weight="900" fill="#B71C1C" text-anchor="middle">FARM FRESH</text>
    
  </g>
</svg>
