<!-- SmartStock Supermarket Product Packshot: Fresh Brown Farm Eggs Full Tray 30s -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad_EGGS_002" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F7F5F0" />
    </radialGradient>
    <filter id="packShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172B4D" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#172B4D" flood-opacity="0.08" />
    </filter>
    <linearGradient id="pGrad_EGGS_002" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D4C41" />
      <stop offset="100%" stop-color="#6D4C41" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="320" rx="16" fill="url(#bgGrad_EGGS_002)" />

  <!-- Shadow under pack -->
  <ellipse cx="160" cy="275" rx="72" ry="12" fill="#172B4D" opacity="0.10" />

  <!-- Main Product Container (Square / Retail Packshot) -->
  <g filter="url(#packShadow)">
    
      <!-- Tray Container -->
      <rect x="85" y="110" width="150" height="130" rx="14" fill="#8D6E63" stroke="#6D4C41" stroke-width="2" />
      <!-- Eggs grid inside tray -->
      <ellipse cx="115" cy="140" rx="16" ry="22" fill="#FFE0B2" stroke="#FFCC80" stroke-width="1.5" />
      <ellipse cx="160" cy="140" rx="16" ry="22" fill="#FFE0B2" stroke="#FFCC80" stroke-width="1.5" />
      <ellipse cx="205" cy="140" rx="16" ry="22" fill="#FFE0B2" stroke="#FFCC80" stroke-width="1.5" />
      <ellipse cx="115" cy="195" rx="16" ry="22" fill="#FFE0B2" stroke="#FFCC80" stroke-width="1.5" />
      <ellipse cx="160" cy="195" rx="16" ry="22" fill="#FFE0B2" stroke="#FFCC80" stroke-width="1.5" />
      <ellipse cx="205" cy="195" rx="16" ry="22" fill="#FFE0B2" stroke="#FFCC80" stroke-width="1.5" />
      <!-- Label Banner -->
      <rect x="95" y="80" width="130" height="40" rx="8" fill="url(#pGrad_EGGS_002)" />
      <text x="160" y="105" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">LOCAL FARM</text>
    
  </g>
</svg>
