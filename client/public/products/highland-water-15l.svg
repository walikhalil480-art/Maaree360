<!-- SmartStock Supermarket Product Packshot: Highland Natural Mineral Water 1.5 Litres -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad_WATER_004" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F7F5F0" />
    </radialGradient>
    <filter id="packShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172B4D" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#172B4D" flood-opacity="0.08" />
    </filter>
    <linearGradient id="pGrad_WATER_004" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#01579B" />
      <stop offset="100%" stop-color="#01579B" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="320" rx="16" fill="url(#bgGrad_WATER_004)" />

  <!-- Shadow under pack -->
  <ellipse cx="160" cy="275" rx="72" ry="12" fill="#172B4D" opacity="0.10" />

  <!-- Main Product Container (Square / Retail Packshot) -->
  <g filter="url(#packShadow)">
    
      <!-- Bottle Neck & Cap -->
      <rect x="142" y="32" width="36" height="24" rx="4" fill="#81D4FA" stroke="#E4E7EC" stroke-width="1.5" />
      <path d="M 144 56 L 125 90 L 195 90 L 176 56 Z" fill="#01579B" opacity="0.85" />
      <!-- Bottle Body -->
      <rect x="110" y="90" width="100" height="175" rx="16" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="2" />
      <!-- Label Band -->
      <rect x="110" y="115" width="100" height="95" fill="url(#pGrad_WATER_004)" />
      <rect x="110" y="210" width="100" height="4" fill="#81D4FA" />
      <text x="160" y="148" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">HIGHLAND</text>
      <text x="160" y="172" font-family="'Inter', -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#FFFFFF" opacity="0.95" text-anchor="middle">MINERAL WATER - 1.5L</text>
      <circle cx="160" cy="192" r="7" fill="#81D4FA" />
    
  </g>
</svg>
