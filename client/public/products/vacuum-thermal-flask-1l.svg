<!-- SmartStock Supermarket Product Packshot: Double Wall Stainless Vacuum Thermal Flask 1.0L -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad_KITCH_009" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F7F5F0" />
    </radialGradient>
    <filter id="packShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172B4D" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#172B4D" flood-opacity="0.08" />
    </filter>
    <linearGradient id="pGrad_KITCH_009" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="320" rx="16" fill="url(#bgGrad_KITCH_009)" />

  <!-- Shadow under pack -->
  <ellipse cx="160" cy="275" rx="72" ry="12" fill="#172B4D" opacity="0.10" />

  <!-- Main Product Container (Square / Retail Packshot) -->
  <g filter="url(#packShadow)">
    
      <!-- Cookware Body Silhouette -->
      <ellipse cx="160" cy="100" rx="68" ry="18" fill="#ECEFF1" stroke="#90A4AE" stroke-width="2" />
      <rect x="92" y="100" width="136" height="120" rx="10" fill="url(#pGrad_KITCH_009)" stroke="#78909C" stroke-width="2" />
      <!-- Handles -->
      <rect x="74" y="115" width="18" height="28" rx="4" fill="#37474F" />
      <rect x="228" y="115" width="18" height="28" rx="4" fill="#37474F" />
      <!-- Lid Knob -->
      <rect x="154" y="80" width="12" height="12" rx="3" fill="#263238" />
      <!-- Brand & Product Badge -->
      <rect x="110" y="145" width="100" height="48" rx="6" fill="#FFFFFF" opacity="0.9" />
      <text x="160" y="166" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="900" fill="#263238" text-anchor="middle">DAYDAYS</text>
      <text x="160" y="182" font-family="'Inter', -apple-system, sans-serif" font-size="7" font-weight="800" fill="#047857" text-anchor="middle">THERMAL FLASK - 1.0 LITRE</text>
    
  </g>
</svg>
