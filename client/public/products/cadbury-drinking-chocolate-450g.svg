<!-- SmartStock Supermarket Product Packshot: Cadbury Drinking Chocolate Powder 450g -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad_BREAK_001" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F7F5F0" />
    </radialGradient>
    <filter id="packShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172B4D" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#172B4D" flood-opacity="0.08" />
    </filter>
    <linearGradient id="pGrad_BREAK_001" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311B92" />
      <stop offset="100%" stop-color="#311B92" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="320" rx="16" fill="url(#bgGrad_BREAK_001)" />

  <!-- Shadow under pack -->
  <ellipse cx="160" cy="275" rx="72" ry="12" fill="#172B4D" opacity="0.10" />

  <!-- Main Product Container (Square / Retail Packshot) -->
  <g filter="url(#packShadow)">
    
      <!-- Can Top Rim -->
      <ellipse cx="160" cy="55" rx="55" ry="12" fill="#E4E7EC" stroke="#9E9E9E" stroke-width="1.5" />
      <ellipse cx="160" cy="55" rx="35" ry="7" fill="#CFD8DC" />
      <!-- Can Body -->
      <rect x="105" y="55" width="110" height="195" rx="8" fill="url(#pGrad_BREAK_001)" stroke="#B0BEC5" stroke-width="2" />
      <!-- Accent Stripe -->
      <rect x="105" y="145" width="110" height="6" fill="#EDE7F6" />
      <!-- Can Bottom Rim -->
      <ellipse cx="160" cy="250" rx="55" ry="12" fill="url(#pGrad_BREAK_001)" />
      <text x="160" y="125" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">CADBURY</text>
      <text x="160" y="175" font-family="'Inter', -apple-system, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" opacity="0.9" text-anchor="middle">DRINKING CHOCOLATE - 450G</text>
    
  </g>
</svg>
