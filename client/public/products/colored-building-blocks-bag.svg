<!-- SmartStock Supermarket Product Packshot: Classic Colored Building Bricks Blocks 50-Piece Bag -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad_TOY_002" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F7F5F0" />
    </radialGradient>
    <filter id="packShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172B4D" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#172B4D" flood-opacity="0.08" />
    </filter>
    <linearGradient id="pGrad_TOY_002" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="320" rx="16" fill="url(#bgGrad_TOY_002)" />

  <!-- Shadow under pack -->
  <ellipse cx="160" cy="275" rx="72" ry="12" fill="#172B4D" opacity="0.10" />

  <!-- Main Product Container (Square / Retail Packshot) -->
  <g filter="url(#packShadow)">
    
      <!-- Book / Box Package -->
      <rect x="85" y="55" width="150" height="210" rx="8" fill="url(#pGrad_TOY_002)" stroke="#CFD8DC" stroke-width="2" />
      <!-- Book Spine -->
      <rect x="85" y="55" width="16" height="210" rx="4" fill="#F59E0B" />
      <!-- Ruled lines / Frame -->
      <rect x="115" y="85" width="105" height="100" rx="6" fill="#FFFFFF" />
      <text x="167" y="118" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="900" fill="#2563EB" text-anchor="middle">TOYWORLD</text>
      <text x="167" y="138" font-family="'Inter', -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#616161" text-anchor="middle">BUILDING BLOCKS - 50PCS</text>
      <line x1="125" y1="152" x2="209" y2="152" stroke="#E0E0E0" stroke-width="1.5" />
      <line x1="125" y1="165" x2="209" y2="165" stroke="#E0E0E0" stroke-width="1.5" />
    
  </g>
</svg>
