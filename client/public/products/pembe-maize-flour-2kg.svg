<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad_PEMBE" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFFDE7" />
    </radialGradient>
    <filter id="packShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172B4D" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#172B4D" flood-opacity="0.08" />
    </filter>
    <linearGradient id="primaryGrad_PEMBE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B5E20" />
      <stop offset="100%" stop-color="#1B5E20" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="320" rx="16" fill="url(#bgGrad_PEMBE)" />

  <!-- Shadow under pack -->
  <ellipse cx="160" cy="275" rx="72" ry="12" fill="#172B4D" opacity="0.10" />

  <!-- Main Product Container (Square / Retail Packshot) -->
  <g filter="url(#packShadow)">
    <!-- Package Body -->
    <rect x="75" y="45" width="170" height="220" rx="14" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="2" />
    
    <!-- Top Header Color Block -->
    <path d="M 75 59 Q 75 45 89 45 L 231 45 Q 245 45 245 59 L 245 125 L 75 125 Z" fill="url(#primaryGrad_PEMBE)" />
    
    <!-- Accent Ribbon / Stripe -->
    <rect x="75" y="125" width="170" height="6" fill="#D32F2F" />
    
    <!-- Brand Title -->
    <text x="160" y="85" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
      PEMBE
    </text>
    
    <!-- Subtitle on Header -->
    <text x="160" y="105" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#FFFFFF" opacity="0.9" text-anchor="middle" letter-spacing="1">
      SIFTED MAIZE MEAL
    </text>

    <!-- Center Pack Visual Motif -->
    <circle cx="160" cy="180" r="38" fill="#FFFDE7" stroke="#E4E7EC" stroke-width="1.5" />
    <circle cx="160" cy="180" r="30" fill="#FFFFFF" />

    <!-- Quality Seal / Badge -->
    <rect x="110" y="222" width="100" height="18" rx="9" fill="#1B5E20" opacity="0.08" />
    <text x="160" y="234" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="800" fill="#1B5E20" text-anchor="middle" letter-spacing="0.5">
      FORTIFIED
    </text>

    <!-- Net Quantity / Weight -->
    <text x="160" y="255" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#252B36" text-anchor="middle">
      2 KG NET
    </text>

    <!-- Inner Illustration Symbol based on product type -->
    <path d="M152 165 C152 155 168 155 168 165 L166 195 C166 200 154 200 154 195 Z" fill="#D32F2F" />
              <path d="M148 185 C145 175 142 165 152 160 C154 175 152 185 148 185 Z" fill="#1B5E20" />
              <path d="M172 185 C175 175 178 165 168 160 C166 175 168 185 172 185 Z" fill="#1B5E20" />
  </g>
</svg>