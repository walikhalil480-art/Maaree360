<!-- SmartStock Supermarket Product Packshot: Unga wa Dola Maize Flour 2kg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad_FLOUR_004" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F7F5F0" />
    </radialGradient>
    <filter id="packShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172B4D" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#172B4D" flood-opacity="0.08" />
    </filter>
    <linearGradient id="pGrad_FLOUR_004" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D47A1" />
      <stop offset="100%" stop-color="#0D47A1" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="320" rx="16" fill="url(#bgGrad_FLOUR_004)" />

  <!-- Shadow under pack -->
  <ellipse cx="160" cy="275" rx="72" ry="12" fill="#172B4D" opacity="0.10" />

  <!-- Main Product Container (Square / Retail Packshot) -->
  <g filter="url(#packShadow)">
    
      <!-- Package Body -->
      <rect x="75" y="45" width="170" height="220" rx="14" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="2" />
      <!-- Header Banner -->
      <path d="M 75 59 Q 75 45 89 45 L 231 45 Q 245 45 245 59 L 245 125 L 75 125 Z" fill="url(#pGrad_FLOUR_004)" />
      <rect x="75" y="125" width="170" height="6" fill="#E65100" />
      <!-- Brand Title -->
      <text x="160" y="85" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">DOLA</text>
      <text x="160" y="105" font-family="'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#FFFFFF" opacity="0.9" text-anchor="middle">PREMIUM MAIZE MEAL - 2KG</text>
      <!-- Circular Quality Seal -->
      <circle cx="160" cy="180" r="32" fill="#E65100" opacity="0.2" />
      <circle cx="160" cy="180" r="26" fill="none" stroke="#0D47A1" stroke-width="1.5" stroke-dasharray="3 3" />
      <text x="160" y="184" font-family="'Inter', -apple-system, sans-serif" font-size="8" font-weight="900" fill="#0D47A1" text-anchor="middle">KENYA GRADE 1</text>
      <!-- Bottom Accent Bar -->
      <rect x="90" y="235" width="140" height="16" rx="4" fill="#0D47A1" />
      <text x="160" y="246" font-family="'Inter', -apple-system, sans-serif" font-size="7.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">PREMIUM QUALITY</text>
    
  </g>
</svg>
