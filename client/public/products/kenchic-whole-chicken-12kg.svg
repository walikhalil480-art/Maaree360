<!-- SmartStock Supermarket Product Packshot: Fresh Dressed Whole Broiler Chicken 1.2kg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad_MEAT_003" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F7F5F0" />
    </radialGradient>
    <filter id="packShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172B4D" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#172B4D" flood-opacity="0.08" />
    </filter>
    <linearGradient id="pGrad_MEAT_003" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D84315" />
      <stop offset="100%" stop-color="#D84315" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="320" rx="16" fill="url(#bgGrad_MEAT_003)" />

  <!-- Shadow under pack -->
  <ellipse cx="160" cy="275" rx="72" ry="12" fill="#172B4D" opacity="0.10" />

  <!-- Main Product Container (Square / Retail Packshot) -->
  <g filter="url(#packShadow)">
    
      <!-- Styrofoam Meat Tray -->
      <rect x="80" y="70" width="160" height="170" rx="12" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="2" />
      <!-- Fresh Meat Cuts Inner Area -->
      <rect x="92" y="82" width="136" height="110" rx="8" fill="url(#pGrad_MEAT_003)" />
      <!-- Cling film highlight -->
      <path d="M 92 82 L 228 192" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="4" />
      <!-- Butcher Pricing Label -->
      <rect x="100" y="195" width="120" height="38" rx="4" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
      <text x="160" y="212" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="900" fill="#D84315" text-anchor="middle">KENCHIC</text>
      <text x="160" y="225" font-family="'Inter', -apple-system, sans-serif" font-size="7" font-weight="700" fill="#616161" text-anchor="middle">WHOLE BROILER CHICKEN - 1.2KG</text>
    
  </g>
</svg>
