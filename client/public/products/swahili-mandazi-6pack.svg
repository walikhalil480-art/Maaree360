<!-- SmartStock Supermarket Product Packshot: Sweet Swahili Mandazi 6-Pack -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad_BAKERY_002" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F7F5F0" />
    </radialGradient>
    <filter id="packShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172B4D" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#172B4D" flood-opacity="0.08" />
    </filter>
    <linearGradient id="pGrad_BAKERY_002" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F57C00" />
      <stop offset="100%" stop-color="#F57C00" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="320" rx="16" fill="url(#bgGrad_BAKERY_002)" />

  <!-- Shadow under pack -->
  <ellipse cx="160" cy="275" rx="72" ry="12" fill="#172B4D" opacity="0.10" />

  <!-- Main Product Container (Square / Retail Packshot) -->
  <g filter="url(#packShadow)">
    
      <!-- Sliced Bread Wrapper -->
      <rect x="75" y="100" width="170" height="120" rx="20" fill="url(#pGrad_BAKERY_002)" stroke="#E4E7EC" stroke-width="2" />
      <!-- Twist Tie on Left -->
      <path d="M 60 150 Q 75 160 75 150 Q 75 140 60 150" fill="#FFE082" />
      <!-- Sliced Lines -->
      <line x1="105" y1="102" x2="105" y2="218" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 4" />
      <line x1="135" y1="102" x2="135" y2="218" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 4" />
      <line x1="185" y1="102" x2="185" y2="218" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 4" />
      <line x1="215" y1="102" x2="215" y2="218" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 4" />
      <!-- Brand Center Label -->
      <rect x="110" y="125" width="100" height="65" rx="8" fill="#FFFFFF" />
      <text x="160" y="152" font-family="'Inter', -apple-system, sans-serif" font-size="15" font-weight="900" fill="#F57C00" text-anchor="middle">FRESH BAKERY</text>
      <text x="160" y="172" font-family="'Inter', -apple-system, sans-serif" font-size="8" font-weight="700" fill="#424242" text-anchor="middle">SWAHILI MANDAZI - 6 PACK</text>
    
  </g>
</svg>
