<!-- SmartStock Supermarket Product Packshot: Peptang Strawberry Jam 500g -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad_SPREAD_003" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F7F5F0" />
    </radialGradient>
    <filter id="packShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172B4D" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#172B4D" flood-opacity="0.08" />
    </filter>
    <linearGradient id="pGrad_SPREAD_003" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2185B" />
      <stop offset="100%" stop-color="#C2185B" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="320" rx="16" fill="url(#bgGrad_SPREAD_003)" />

  <!-- Shadow under pack -->
  <ellipse cx="160" cy="275" rx="72" ry="12" fill="#172B4D" opacity="0.10" />

  <!-- Main Product Container (Square / Retail Packshot) -->
  <g filter="url(#packShadow)">
    
      <!-- Tub Lid -->
      <ellipse cx="160" cy="85" rx="65" ry="16" fill="#F8BBD0" stroke="#E4E7EC" stroke-width="2" />
      <ellipse cx="160" cy="83" rx="58" ry="12" fill="#FFFFFF" opacity="0.4" />
      <!-- Tub Body (tapered) -->
      <path d="M 100 90 L 115 245 Q 160 260 205 245 L 220 90 Z" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="2" />
      <path d="M 104 110 L 113 220 Q 160 230 207 220 L 216 110 Z" fill="url(#pGrad_SPREAD_003)" />
      <text x="160" y="155" font-family="'Inter', -apple-system, sans-serif" font-size="15" font-weight="900" fill="#FFFFFF" text-anchor="middle">PEPTANG</text>
      <text x="160" y="180" font-family="'Inter', -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#FFFFFF" opacity="0.9" text-anchor="middle">STRAWBERRY JAM - 500G</text>
    
  </g>
</svg>
