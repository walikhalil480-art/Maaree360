<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 44" fill="none">
  <!-- TillPro Icon Glyph -->
  <g transform="translate(4, 4)">
    <!-- Base Container -->
    <rect width="36" height="36" rx="9" fill="#142B4A"/>
    
    <!-- Register Display / Scanner Head -->
    <rect x="7" y="7" width="22" height="13" rx="3" fill="#1E3A5F" stroke="#059669" stroke-width="1.5"/>
    
    <!-- Barcode Scanner Lines -->
    <line x1="11.5" y1="10.5" x2="11.5" y2="16.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="14.5" y1="10.5" x2="14.5" y2="16.5" stroke="#059669" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="17.5" y1="10.5" x2="17.5" y2="16.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="21" y1="10.5" x2="21" y2="16.5" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="24" y1="10.5" x2="24" y2="16.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
    
    <!-- Scanner Laser Beam -->
    <line x1="9" y1="13.5" x2="27" y2="13.5" stroke="#059669" stroke-width="0.8" opacity="0.85"/>
    
    <!-- Till Register Base / Cash Drawer -->
    <rect x="7" y="22" width="22" height="7.5" rx="2.5" fill="#059669"/>
    <circle cx="10.5" cy="25.75" r="1" fill="#FFFFFF"/>
    <rect x="14" y="24.75" width="11.5" height="2" rx="1" fill="#142B4A"/>
  </g>

  <!-- TillPro Typography (Dark Text for Light Backgrounds) -->
  <text x="48" y="25" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" letter-spacing="-0.03em">
    <tspan fill="#142B4A">Till</tspan><tspan fill="#059669">Pro</tspan>
  </text>

  <!-- Subtitle Descriptor -->
  <text x="48.5" y="36.5" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="600" fill="#64748B" letter-spacing="0.14em">
    RETAIL MANAGEMENT SYSTEM
  </text>
</svg>
