services:
  db:
    image: postgres:16-alpine
    container_name: smartstock_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-smartstock_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - smartstock_db_data:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smartstock_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smartstock_network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: smartstock_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-smartstock_db}?schema=public
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-KES}
      SESSION_SECRET: ${SESSION_SECRET:-smartstock-production-super-secret-key-32chars}
      COOKIE_NAME: ${COOKIE_NAME:-smartstock_session}
      SESSION_TTL_DAYS: 7
      PRODUCTS_DIR: /app/products
      UPLOAD_DIR: /app/uploads
    ports:
      - "${BACKEND_PORT:-5001}:5001"
    volumes:
      - smartstock_uploads:/app/uploads
      - ./client/public/products:/app/products:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - smartstock_network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: smartstock_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - smartstock_network

volumes:
  smartstock_db_data:
    driver: local
  smartstock_uploads:
    driver: local

networks:
  smartstock_network:
    driver: bridge
